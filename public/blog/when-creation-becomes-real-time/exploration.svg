<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc">
  <title id="title">Explore with intention</title>
  <desc id="desc">A clear intention branches into three directions: simplify the flow, change the hierarchy, and rethink the structure. All three are tested against the same goal.</desc>
  <rect width="640" height="480" rx="12" fill="#111"/>
  <g font-family="monospace" fill="#f5f5f5" text-anchor="middle">
    <text x="32" y="50" font-size="21" text-anchor="start" fill="#aaa">EXPLORE WITH INTENTION</text>
    <rect x="190" y="79" width="260" height="56" rx="8" fill="#eee"/>
    <text x="320" y="115" font-size="23" fill="#111">Clear intention</text>
    <path d="M320 135v35m-202 0h404m-404 0v25m202-25v25m202-25v25" fill="none" stroke="#888" stroke-width="2"/>
    <g fill="#202020" stroke="#555">
      <rect x="32" y="195" width="172" height="160" rx="8"/>
      <rect x="234" y="195" width="172" height="160" rx="8"/>
      <rect x="436" y="195" width="172" height="160" rx="8"/>
    </g>
    <g fill="#ddd">
      <rect x="66" y="219" width="104" height="8" rx="4"/>
      <rect x="66" y="237" width="70" height="8" rx="4"/>
      <rect x="66" y="257" width="40" height="16" rx="4"/>
      <rect x="268" y="219" width="104" height="24" rx="4"/>
      <rect x="268" y="253" width="70" height="8" rx="4" fill="#777"/>
      <rect x="268" y="268" width="90" height="5" rx="2" fill="#777"/>
      <rect x="470" y="219" width="30" height="54" rx="4" fill="#777"/>
      <rect x="510" y="219" width="64" height="24" rx="4"/>
      <rect x="510" y="253" width="64" height="20" rx="4" fill="#999"/>
    </g>
    <g font-size="22">
      <text x="118" y="307">Simplify</text><text x="118" y="334" fill="#bbb">the flow</text>
      <text x="320" y="307">Change the</text><text x="320" y="334" fill="#bbb">hierarchy</text>
      <text x="522" y="307">Rethink the</text><text x="522" y="334" fill="#bbb">structure</text>
    </g>
    <path d="M118 355v28h404v-28m-202 0v52" fill="none" stroke="#888" stroke-width="2"/>
    <text x="320" y="443" font-size="25">Test against the goal.</text>
  </g>
</svg>
