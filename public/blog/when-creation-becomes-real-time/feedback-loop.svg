<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" role="img" aria-labelledby="title desc">
  <title id="title">From waiting to shaping</title>
  <desc id="desc">A separated sequence of describing, waiting for a build, and reviewing becomes a continuous loop of trying, seeing, and adjusting.</desc>
  <rect width="640" height="460" rx="12" fill="#111"/>
  <g font-family="monospace" font-size="24" fill="#f5f5f5">
    <text x="32" y="50" font-size="21" fill="#aaa">FROM WAITING TO SHAPING</text>
    <text x="32" y="109">A sequence of requests</text>
    <rect x="32" y="134" width="150" height="62" rx="8" fill="#292929"/>
    <rect x="238" y="134" width="164" height="62" rx="8" fill="#1b1b1b" stroke="#777" stroke-dasharray="4 6"/>
    <rect x="458" y="134" width="150" height="62" rx="8" fill="#292929"/>
    <g text-anchor="middle" font-size="23">
      <text x="107" y="173">Describe</text>
      <text x="320" y="173" fill="#bbb">Build</text>
      <text x="533" y="173">Review</text>
    </g>
    <path d="M191 165h34m-8-7 8 7-8 7m194-7h34m-8-7 8 7-8 7" fill="none" stroke="#aaa" stroke-width="2"/>
    <path d="M32 234h576" stroke="#383838"/>
    <text x="32" y="281">A continuous conversation</text>
    <rect x="32" y="306" width="576" height="62" rx="8" fill="#eee"/>
    <g fill="#111" text-anchor="middle">
      <text x="128" y="346">Try</text>
      <text x="320" y="346">See</text>
      <text x="512" y="346">Adjust</text>
    </g>
    <path d="M203 337h42m-8-7 8 7-8 7m158-7h42m-8-7 8 7-8 7" fill="none" stroke="#555" stroke-width="2"/>
    <path d="M512 382v25H128v-25m-7 8 7-8 7 8" fill="none" stroke="#aaa" stroke-width="2"/>
  </g>
</svg>
